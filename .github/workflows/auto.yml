name: HeroCraft Auto Craft & Destroy

on:
  schedule:
    # 每15分钟触发（GitHub cron 经常跳过，多设提高命中率）
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HeroCraft auto script (12 min)
        run: python herocraft_auto.py --duration 720
        env:
          HC_LOGIN: ${{ secrets.HC_LOGIN }}
          HC_PASSWORD: ${{ secrets.HC_PASSWORD }}
