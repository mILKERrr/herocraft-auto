name: HeroCraft BFS Auto Craft

on:
  schedule:
    # 每15分钟触发（GitHub cron 经常跳过，多设提高命中率）
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 允许 commit 进度文件回仓库

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BFS craft script (12 min)
        run: python herocraft_bfs.py --duration 720
        env:
          HC_LOGIN: ${{ secrets.HC_LOGIN }}
          HC_PASSWORD: ${{ secrets.HC_PASSWORD }}

      - name: Save progress to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bfs_progress.json bfs_discovered.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No progress changes to save"
          else
            git commit -m "auto-save BFS progress [skip ci]"
            git push
            echo "Progress saved and pushed"
          fi
